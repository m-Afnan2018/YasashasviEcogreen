# nginx reverse proxy for Yasashvi Ecogreen - client, admin, and backend API,
# each on their own subdomain. Runs on the HOST (not in Docker), proxying to
# the ports docker-compose.prod.yml publishes to 127.0.0.1.
#
# Setup:
#   1. Find/replace "yourdomain.com" below with your real domain.
#   2. sudo cp nginx/yasashvi-ecogreen.conf /etc/nginx/sites-available/yasashvi-ecogreen.conf
#   3. sudo ln -s /etc/nginx/sites-available/yasashvi-ecogreen.conf /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. Issue certificates and let certbot rewrite this file to add the HTTPS
#      server blocks + HTTP->HTTPS redirects automatically:
#        sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com -d admin.yourdomain.com -d api.yourdomain.com
#
# IMPORTANT: NEXT_PUBLIC_API_URL / VITE_API_URL are baked into the client and
# admin images at BUILD time (see Makefile), so build/push them pointing at
# the api.yourdomain.com host used below:
#   make release NEXT_PUBLIC_API_URL=https://api.yourdomain.com VITE_API_URL=https://api.yourdomain.com
# And in .env.prod: CORS_ORIGINS=https://yourdomain.com, ADMIN_ORIGINS=https://admin.yourdomain.com

upstream ecogreen_client {
    server 127.0.0.1:3000;
}

upstream ecogreen_admin {
    server 127.0.0.1:4000;
}

upstream ecogreen_api {
    server 127.0.0.1:5000;
}

# ---- Public site ----
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    location / {
        proxy_pass http://ecogreen_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}

# ---- Admin panel ----
server {
    listen 80;
    listen [::]:80;
    server_name admin.yourdomain.com;

    location / {
        proxy_pass http://ecogreen_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}

# ---- Backend API ----
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Blog cover image uploads go up to 5MB (see server/src/routes/admin/uploads.routes.ts) -
    # nginx's 1MB default would reject those with a 413 before they reach the backend.
    client_max_body_size 10M;

    location / {
        proxy_pass http://ecogreen_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
